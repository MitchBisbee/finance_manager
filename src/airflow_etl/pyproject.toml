[project]
name = "airflow_etl"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "db",
    "plaid-python>=45.0.0",
]

[tool.uv.sources]
db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
include = ["**/*"]
sources = { "" = "airflow_etl" }
