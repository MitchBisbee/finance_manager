[project]
name = "finance_manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "db"
]
[project.scripts]
app = "finance_manager.app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
db = { workspace = true }

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
include = ["**/*"]
sources = { "" = "finance_manager" }
