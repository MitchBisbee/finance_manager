[project]
name = "finance-manager-root"
version = "0.1.0"
description = "Monorepo Workspace Environment for Personal Finance Tracker"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas",
    "plotly",
    "requests",
    "PySide6",
    "PySide6-Addons",
    "alembic>=1.20.0",
    "db",
    "finance_manager",
    "airflow_etl",
]

[project.optional-dependencies]
dev = [
    "black",       
    "ruff",        
    "pytest",     
    "pytest-cov",
    "apache-airflow>=2.10.2",
    "apache-airflow-providers-cncf-kubernetes>=8.0.0",
]

[tool.uv.sources]
db = { workspace = true }
finance_manager = { workspace = true }
airflow_etl = { workspace = true }

[tool.uv.workspace]
members = ["src/*"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []  # Forcefully tells the engine that there are no root packages to compile

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
