[project]
name = "finance-manager-root"
version = "0.1.0"
description = "Monorepo Workspace Environment for Personal Finance Tracker"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas",
    "plotly",
    "requests",
    "PySide6",
    "PySide6-Addons",
    "plaid-python>=45.0.0",
    "sqlalchemy>=2.1.5",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "black",       
    "ruff",        
    "pytest",     
    "pytest-cov",
    "apache-airflow>=2.10.2",
    "apache-airflow-providers-cncf-kubernetes>=8.0.0",
]

[tool.uv.workspace]
members = ["src/*"]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []  # Forcefully tells the engine that there are no root packages to compile

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
