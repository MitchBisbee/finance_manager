[project]
name = "finance-manager"
version = "0.1.0"
description = "Finance manager environment"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas",
    "plotly",
    "requests",
    "PySide6",
    "PySide6-Addons",
    "typing",
    "plaid-python>=45.0.0",
    "sqlalchemy>=2.1.5",
    "psycopg>=3.3.6",
]

[project.optional-dependencies]
dev = [
    "black",       
    "ruff",        
    "pytest",     
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
app = "app.__main__:main"
